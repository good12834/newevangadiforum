services:
  - type: web
    name: evangadi-forum-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Database credentials - MUST be configured in Render dashboard
      # Get these from your Aiven MySQL database service
      # Option 1: Use individual variables (ensure Aiven allows public access)
      - key: DB_USER
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: 10171
      # Option 2: Or use MYSQL_URL (recommended - format: mysql://user:pass@host:port/db)
      - key: MYSQL_URL
        sync: false
      - key: AI_MODE
        value: auto
      - key: AI_PROVIDER
        value: auto
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://newevangadiforum.vercel.app/
    healthCheckPath: /
